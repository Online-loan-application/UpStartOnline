  <style>
    @font-face{font-family:"Cormorant Garamond";src:url("./assets/fonts/cormorant-garamond-regular.ttf") format("truetype");font-style:normal;font-weight:400;font-display:swap}
    @font-face{font-family:"Cormorant Garamond";src:url("./assets/fonts/cormorant-garamond-medium.ttf") format("truetype");font-style:normal;font-weight:500;font-display:swap}

    :root{

    body{min-width:320px;background:var(--surface-soft);color:var(--text-on-light);font:400 16px/1.65 var(--font-body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
    img,svg{display:block;max-width:100%}a{color:inherit;text-decoration:none}button,input,select{font:inherit}button,select{cursor:pointer}button{color:inherit}
    :focus-visible{outline:3px solid var(--accent-strong);outline-offset:4px}::selection{background:var(--accent);color:var(--p-teal-950)}

    .account-layout{max-width:760px;transform:translateY(-48px)}.account-card{padding:48px}.account-notice{display:grid;gap:4px;margin:24px 0;padding:16px 18px;border-left:3px solid var(--p-teal-900);background:var(--surface-soft);font-size:13px;line-height:1.5}.account-notice strong{font-size:11px;letter-spacing:.1em;text-transform:uppercase}.account-fields{grid-template-columns:1fr}.account-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}.account-actions button:disabled{opacity:.6;cursor:wait}.account-message{margin-top:16px;color:var(--p-teal-900);font-size:13px}.account-back{display:inline-flex;margin-top:24px;color:var(--text-muted);font-size:13px;text-decoration:underline;text-underline-offset:3px}.dashboard-nav{display:flex;align-items:center;gap:20px;font-size:13px}.dashboard-nav .button{min-height:42px;padding:10px 18px}.dashboard-main .application-hero h1{max-width:740px}.dashboard-heading{display:flex;align-items:end;justify-content:space-between;gap:24px;margin:0 0 28px}.dashboard-heading h2{margin-top:6px;font-family:var(--font-display);font-size:40px;font-weight:500;line-height:1.05}.dashboard-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid color-mix(in oklch,var(--p-teal-900) 18%,transparent);border-bottom:1px solid color-mix(in oklch,var(--p-teal-900) 18%,transparent)}.dashboard-stat{display:grid;align-content:start;gap:8px;min-height:176px;padding:26px 24px;border-right:1px solid color-mix(in oklch,var(--p-teal-900) 18%,transparent)}.dashboard-stat:first-child{padding-left:0}.dashboard-stat:last-child{border-right:0}.dashboard-stat>span,.dashboard-stat small{color:var(--text-muted);font-size:12px}.dashboard-stat strong{font-family:var(--font-display);font-size:32px;font-weight:500;line-height:1.1;overflow-wrap:anywhere}.dashboard-details{display:grid;grid-template-columns:1fr 1fr;gap:48px;padding:32px 0}.dashboard-details h3{margin-bottom:10px;font-size:12px;letter-spacing:.1em;text-transform:upperca
